{% extends 'base.html' %}{% block content %}<div class="titlebar"><h1>{{ item.name if item else _('New destination') }}</h1></div>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post" action="/destinations/save"><input type="hidden" name="_csrf" value="{{ csrf }}"><input type="hidden" name="id" value="{{ item.id if item else '' }}"><div class="panel"><div class="panelhead">{{ _('HTTP Destination') }}</div><div class="panelbody formgrid"><div class="field"><label>{{ _('Name') }}</label><input class="input" name="name" required value="{{ item.name if item else '' }}" autocomplete="off"></div><div class="field"><label>{{ _('Methode') }}</label><select name="method">{% for m in ['POST','PUT','PATCH','GET','DELETE'] %}<option {% if item and item.method==m %}selected{% endif %}>{{ m }}</option>{% endfor %}</select></div><div class="field full"><label>URL</label><input class="input" name="url" type="url" required value="{{ item.url if item else '' }}" placeholder="https://api.example.com/webhook" autocomplete="off"></div><div class="field"><label>{{ _('Query Parameter (key: value)') }}</label><textarea name="query_params" rows="4">{% if item %}{% for k,v in item.query_params.items() %}{{ k }}: {{ v }}
{% endfor %}{% endif %}</textarea></div><div class="field"><label>{{ _('Headers (Name: Wert)') }}</label><textarea name="headers" rows="4">{% if item %}{% for k,v in item.headers.items() %}{{ k }}: {{ v }}
{% endfor %}{% endif %}</textarea></div><label class="check"><input type="checkbox" name="active" {% if not item or item.active %}checked{% endif %}> {{ _('Aktiv') }}</label><label class="check"><input type="checkbox" name="verify_tls" {% if not item or item.verify_tls %}checked{% endif %}> {{ _('TLS-Zertifikat prüfen') }}</label></div></div><div class="panel"><div class="panelhead">{{ _('Authentifizierung') }}</div><div class="panelbody formgrid"><div class="field"><label>{{ _('Typ') }}</label><select name="auth_type"><option value="none">{{ _('Keine') }}</option>{% for v,n in [('bearer','Bearer Token'),('api_key','API Key'),('basic','Basic Auth'),('custom','Custom Header')] %}<option value="{{ v }}" {% if item and item.auth_type==v %}selected{% endif %}>{{ n }}</option>{% endfor %}</select></div><div class="field"><label>{{ _('Headername') }}</label><input class="input" name="auth_header_name" value="{{ item.auth_header_name if item else '' }}" autocomplete="off"></div><div class="field"><label>{{ _('Benutzername') }}</label><input class="input" name="auth_username" value="{{ item.auth_username if item else '' }}" autocomplete="off"></div><div class="field"><label>Secret {% if item and item.auth_secret_encrypted %}<span class="muted">{{ _('(gespeichert)') }}</span>{% endif %}</label><input class="input" type="password" name="auth_secret" autocomplete="new-password"></div></div></div><div class="panel"><div class="panelhead">{{ _('Retry & Netzwerk') }}</div><div class="panelbody formgrid"><div class="field"><label>{{ _('Timeout (s)') }}</label><input class="input" type="number" min="1" name="timeout_seconds" value="{{ item.timeout_seconds if item else 15 }}"></div><div class="field"><label>{{ _('Max. Versuche') }}</label><input class="input" type="number" min="1" max="20" name="retry_attempts" value="{{ item.retry_attempts if item else 5 }}"></div><div class="field"><label>{{ _('Retry Delays in Sekunden') }}</label><textarea name="retry_delays" rows="4">{{ item.retry_delays|join('\n') if item else '30\n120\n600\n1800' }}</textarea></div><div class="field"><label>{{ _('Retry HTTP Status') }}</label><textarea name="retry_statuses" rows="4">{{ item.retry_statuses|join('\n') if item else '429\n500\n502\n503\n504' }}</textarea></div><label class="check"><input type="checkbox" name="retry_exponential" {% if item and item.retry_exponential %}checked{% endif %}> {{ _('Exponential Backoff') }}</label><label class="check"><input type="checkbox" name="allow_private" {% if item and item.allow_private %}checked{% endif %}> {{ _('Private Netzwerkziele erlauben') }}</label><label class="check"><input type="checkbox" name="allow_localhost" {% if item and item.allow_localhost %}checked{% endif %}> {{ _('Localhost erlauben') }}</label></div></div><div class="actions"><button class="btn primary">{{ _('Save') }}</button><a class="btn" href="/destinations">{{ _('Abbrechen') }}</a></div></form>{% if item %}<form method="post" action="/destinations/{{ item.id }}/delete" style="margin-top:14px"><input type="hidden" name="_csrf" value="{{ csrf }}"><button class="btn danger">{{ _('Delete') }}</button></form>{% endif %}{% endblock %}
