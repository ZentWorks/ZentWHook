{% extends 'base.html' %}{% block content %}<div class="titlebar"><h1>{{ _('Edit & Replay') }}</h1></div><form method="post"><input type="hidden" name="_csrf" value="{{ csrf }}"><div class="panel"><div class="panelbody formgrid"><div class="field"><label>{{ _('Methode') }}</label><select name="method">{% for m in item.endpoint.methods %}<option {% if item.method==m %}selected{% endif %}>{{ m }}</option>{% endfor %}</select></div><div class="field full"><label>{{ _('Body') }}</label><textarea class="code" name="body" rows="18">{{ body }}</textarea></div><div class="field"><label>{{ _('Headers') }}</label><textarea name="headers" rows="12">{% for k,v in headers.items() %}{{ k }}: {{ v }}
{% endfor %}</textarea></div><div class="field"><label>{{ _('Query') }}</label><textarea name="query" rows="12">{% for k,v in query.items() %}{{ k }}: {{ v }}
{% endfor %}</textarea></div></div></div><button class="btn primary">{{ _('Replay') }}</button></form>{% endblock %}
