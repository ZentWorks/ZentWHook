{% for e in items %}<tr class="clickable-row" data-href="/events/{{ e.id }}?return_to=/endpoints/{{ item.id }}" tabindex="0"><td class="event-select-col"><input class="event-diff-checkbox" type="checkbox" data-event-diff-select data-event-id="{{ e.id }}" aria-label="Event-ID {{ e.id }} für JSON Diff auswählen"></td><td class="mono">#{{ e.id }}</td><td>{{ e.received_at.strftime('%Y-%m-%d %H:%M:%S') }}</td><td class="mono small">{{ e.request_id }}</td><td>{{ _(e.status) }}</td></tr>{% endfor %}
