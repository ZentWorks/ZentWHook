{% for e in items %}<tr class="clickable-row event-row" data-href="/events/{{ e.id }}?return_to={{ events_return_to|urlencode }}" data-event-id="{{ e.id }}" data-event-label="#{{ e.id }} · {{ e.endpoint.name }} · {{ e.received_at.strftime('%Y-%m-%d %H:%M:%S') }}" tabindex="0"><td class="event-select-col"><input class="event-diff-checkbox" type="checkbox" data-event-diff-select data-event-id="{{ e.id }}" aria-label="Event-ID {{ e.id }} für JSON Diff auswählen"></td><td class="mono">#{{ e.id }}</td><td>{{ e.received_at.strftime('%Y-%m-%d %H:%M:%S') }}</td><td>{{ e.endpoint.name }}</td><td class="mono small" title="{{ e.request_id }}">{{ e.request_id }}</td><td>{{ e.source_ip }}</td><td>{{ e.method }}</td><td>{{ _(e.status) }}</td></tr>{% else %}<tr class="events-empty-row"><td colspan="8" class="empty">{{ _('No events') }}</td></tr>{% endfor %}
