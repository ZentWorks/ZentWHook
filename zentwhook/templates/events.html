{% extends 'base.html' %}{% block content %}
<div class="titlebar"><h1><svg class="ico page-icon"><use href="#i-events"/></svg>{{ _('Events') }}</h1></div>
<form class="panel panelbody formgrid" method="get" action="/events" data-events-filter-form data-filter-error="{{ _('Event-Suche konnte nicht geladen werden.') }}">
  <div class="field"><label>{{ _('Suche') }}</label><input class="input" name="q" value="{{ filters.q }}" placeholder="{{ _('Request-ID oder Payload') }}"></div>
  <div class="field"><label>{{ _('Endpoint') }}</label><select name="endpoint"><option value="">{{ _('Alle') }}</option>{% for e in endpoints %}<option value="{{ e.id }}" {% if filters.endpoint==e.id %}selected{% endif %}>{{ e.name }}</option>{% endfor %}</select></div>
  <div class="field"><label>{{ _('Status') }}</label><select name="status"><option value="">{{ _('Alle') }}</option>{% for s in ['queued','processing','processed','failed'] %}<option value="{{ s }}" {% if filters.status==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></div>
  <div class="field"><label>{{ _('Ziel') }}</label><select name="destination"><option value="">{{ _('Alle') }}</option>{% for d in destinations %}<option value="{{ d.id }}" {% if filters.destination==d.id %}selected{% endif %}>{{ d.name }}</option>{% endfor %}</select></div>
  <div class="field"><label>{{ _('Source IP') }}</label><input class="input" name="source_ip" value="{{ filters.source_ip }}"></div>
  <div class="field"><label>{{ _('Von') }}</label><input class="input" type="date" name="date_from" value="{{ filters.date_from }}"></div>
  <div class="field"><label>{{ _('Bis') }}</label><input class="input" type="date" name="date_to" value="{{ filters.date_to }}"></div>
  <div class="field"><label>&nbsp;</label><button class="btn" type="submit"><svg class="ico"><use href="#i-events"/></svg>{{ _('Search') }}</button></div>
</form>
<div class="panel" data-events-results-panel><div class="panelhead rowbetween"><span class="head-with-icon"><svg class="ico"><use href="#i-events"/></svg>{{ _('Events') }}</span><button type="button" class="btn sm" data-json-diff-button data-target="events-list" disabled><svg class="ico"><use href="#i-compare"/></svg>{{ _('JSON Diff') }}</button></div><div class="tablewrap"><table><thead><tr><th class="event-select-col" aria-label="{{ _('Vergleich auswählen') }}"></th><th>Event-ID</th><th>{{ _('Zeit') }}</th><th>{{ _('Endpoint') }}</th><th>{{ _('Request-ID') }}</th><th>{{ _('Source IP') }}</th><th>{{ _('Methode') }}</th><th>{{ _('Status') }}</th></tr></thead><tbody data-load-more-target="events-list" data-diff-selection-scope="events-list">{% include 'event_rows.html' %}</tbody></table></div><div data-events-load-more-host data-more-label="{{ _('Mehr anzeigen') }}" data-load-error="{{ _('Weitere Events konnten nicht geladen werden.') }}">{% if next_url %}<div class="load-more-wrap"><button type="button" class="btn" data-load-more data-target="events-list" data-url="{{ next_url }}" data-load-error="{{ _('Weitere Events konnten nicht geladen werden.') }}">{{ _('Mehr anzeigen') }}</button></div>{% endif %}</div></div>
{% endblock %}
