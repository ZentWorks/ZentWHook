<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZentWHook · {{ _('Login') }}</title><link rel="icon" type="image/png" href="/static/zentwhook-logo.png?v={{ asset_version }}"><link rel="stylesheet" href="/static/app.css?v={{ asset_version }}"></head><body><div class="loginwrap"><form class="loginbox" method="post"><div class="brand auth-brand"><img class="brand-logo" src="/static/zentwhook-logo.png?v={{ asset_version }}" alt="" aria-hidden="true"><span class="brand-text">Zent<span class="brand-accent">W</span>Hook</span></div>{% if error %}<div class="error">{{ error }}</div>{% endif %}<div class="field"><label>{{ _('Email') }}</label><input class="input" type="email" name="email" required autocomplete="username"></div><div class="field" style="margin-top:12px"><label>{{ _('Password') }}</label><input class="input" type="password" name="password" required autocomplete="current-password"></div><div style="margin-top:16px"><button class="btn primary" type="submit">{{ _('Anmelden') }}</button></div></form></div></body></html>
