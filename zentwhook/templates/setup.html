<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZentWHook Setup</title><link rel="icon" type="image/png" href="/static/zentwhook-logo.png"><link rel="stylesheet" href="/static/app.css"></head><body><div class="loginwrap"><form class="loginbox" method="post"><div class="brand auth-brand"><img class="brand-logo" src="/static/zentwhook-logo.png" alt="" aria-hidden="true"><span class="brand-text">Zent<span class="brand-accent">W</span>Hook</span></div><h1>{{ _('Admin erstellen') }}</h1>{% if error %}<div class="error">{{ error }}</div>{% endif %}<div class="formgrid"><div class="field full"><label>{{ _('Name') }}</label><input class="input" name="name" required autocomplete="off"></div><div class="field full"><label>{{ _('Email') }}</label><input class="input" type="email" name="email" required autocomplete="off"></div><div class="field full"><label>{{ _('Password') }}</label><input class="input" type="password" name="password" minlength="10" required autocomplete="new-password"></div><div class="field full"><label>{{ _('Language') }}</label><select name="language"><option value="de" {% if lang=='de' %}selected{% endif %}>{{ _('Deutsch') }}</option><option value="en" {% if lang=='en' %}selected{% endif %}>{{ _('English') }}</option></select></div></div><div style="margin-top:16px"><button class="btn primary">{{ _('Setup abschließen') }}</button></div></form></div></body></html>
